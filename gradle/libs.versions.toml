# Version catalog for Recipe for Disaster.
#
# First round of versions (2026-09-29) were checked against official sources
# but never actually dependency-resolved, since this sandbox has no network
# access to Maven Central/Google's Maven. When Ayah's first real Android
# Studio sync (2026-09-30) hit a 404 on the `ksp` plugin version, that was
# re-verified with live web search against kotlinlang.org/github.com/
# developer.android.com, and the same pass re-checked every other pinned
# version below against its official release-notes page while in there —
# `coreKtx`, `lifecycle`, `activityCompose`, and `navigationCompose` were all
# genuinely stale (they'd still have resolved, just to old releases) and are
# now bumped to what those pages list as current. `kotlin`, `agp`,
# `composeBom`, `room`, and `kotlinxSerialization` were re-checked too and
# confirmed still correct as originally pinned.
[versions]
kotlin = "2.4.20"
agp = "9.4.0"
composeBom = "2026.09.00"
room = "2.8.5"
ksp = "2.3.10" # KSP dropped the old "<kotlinVersion>-N" naming; it now has its own independent version line. kotlinlang.org's own KSP quickstart doc pairs Kotlin 2.4.20 with KSP 2.3.10 in its example — the previous "2.4.20-1.0.30" value here doesn't exist under the new scheme and 404'd during sync.
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espressoCore = "3.7.0" # 3.6.x crashes on Android 17 (InputManager.getInstance was removed)
coroutines = "1.9.0"
kotlinxSerialization = "1.11.0" # runtime library version; the compiler plugin itself tracks the Kotlin version above.

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
